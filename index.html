<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synonym Finder</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-1: #fff1f5;
      --bg-2: #f0f1ff;
      --bg-3: #ecfdfa;
      --card: #ffffff;
      --ink: #4f3f57;
      --ink-soft: #93829c;
      --accent: #f472b6;
      --accent-2: #a78bfa;
      --ring: rgba(244, 114, 182, .3);
      --border: rgba(167, 139, 250, .2);
      --shadow: 0 20px 45px -14px rgba(146, 109, 168, .4);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #271d33;
        --bg-2: #1c2139;
        --bg-3: #15272c;
        --card: #2c2338;
        --ink: #f4ebf8;
        --ink-soft: #b6a4c2;
        --accent: #f9a8d4;
        --accent-2: #c4b5fd;
        --ring: rgba(249, 168, 212, .28);
        --border: rgba(196, 181, 253, .16);
        --shadow: 0 20px 45px -14px rgba(0, 0, 0, .6);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display",
                   system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background:
        radial-gradient(1100px 620px at 12% -8%, var(--bg-1), transparent 60%),
        radial-gradient(900px 620px at 92% 6%, var(--bg-3), transparent 58%),
        var(--bg-2);
    }

    /* decorative only — never intercepts clicks */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(58px);
      opacity: .5;
      pointer-events: none;
      z-index: 0;
    }
    .blob.one   { width: 300px; height: 300px; top: -70px; left: -60px;  background: var(--accent); }
    .blob.two   { width: 260px; height: 260px; bottom: -80px; right: -50px; background: var(--accent-2); }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 40px 34px 34px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      box-shadow: var(--shadow);
    }

    .mascot {
      font-size: 2.75rem;
      line-height: 1;
      display: block;
      margin-bottom: 10px;
      animation: bob 3.6s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-9px) rotate(3deg); }
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      letter-spacing: -.02em;
      background: linear-gradient(100deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0 0 26px;
      font-size: .95rem;
      color: var(--ink-soft);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    input {
      flex: 1 1 200px;
      min-width: 0;
      font: inherit;
      font-size: 1.05rem;
      padding: 13px 18px;
      color: var(--ink);
      background: color-mix(in srgb, var(--accent-2) 7%, transparent);
      border: 2px solid transparent;
      border-radius: 999px;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input::placeholder { color: var(--ink-soft); }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 5px var(--ring);
    }

    button {
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 13px 24px;
      color: #fff;
      background: linear-gradient(100deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px var(--accent);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    button:hover  { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 15px 26px -9px var(--accent); }
    button:active { transform: translateY(0) scale(.97); }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

    #results {
      margin-top: 24px;
      padding: 18px 20px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      border-radius: 22px;
      transition: background .2s ease;
    }
    #results:empty {
      color: var(--ink-soft);
      font-size: .9rem;
      border: 2px dashed var(--border);
    }
    #results:empty::before {
      content: "your synonyms will bloom here 🌱";
    }
    #results:not(:empty) {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 1px solid var(--border);
      animation: pop .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.94); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>

  <main class="card">
    <span class="mascot" aria-hidden="true">🌸</span>
    <h1>Synonym Finder</h1>
    <p class="subtitle">Type a word to find synonyms.</p>

    <div class="row">
      <input id="wordInput" type="text" placeholder="Enter a word" />
      <button onclick="findSynonyms()">Find Synonyms</button>
    </div>

    <div id="results"></div>
  </main>

  <script>
    function findSynonyms() {
      const val = document.getElementById('wordInput').value;
      document.getElementById('results').innerText = "Synonyms for: " + val;
      // Nothing here yet — build me! Could use a hardcoded list or a free thesaurus API.
    }
  </script>
</body>
</html>
